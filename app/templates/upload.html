<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Yükle - Üretim Asistanım</title>
    <style>
        /* Genel sayfa tasarımı ve font ayarları */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* Ana form kartı (container) tasarımı */
        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* Başlık stili */
        h1 {
            margin-top: 0;
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* Açıklama metni stili */
        p.subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Dosya Seçim Form Elemanı */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }

        /* Dosya seçme kutusu stili */
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #475569;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input[type="file"]:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        /* Buton Grubu Tasarımı */
        .button-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Ön İzle Butonu */
        .btn-submit {
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        /* İptal/Geri Dön Bağlantısı */
        .btn-back {
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .btn-back:hover {
            color: #334155;
        }

        /* Hata Mesajı Banner Stili */
        .error-banner {
            background-color: #fef2f2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Desteklenen Format Bilgisi */
        .format-info {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel Dosyası Yükle</h1>
        <p class="subtitle">Üretim veya sipariş verilerinizi sisteme aktarmadan önce Excel dosyasını seçip ön izleyebilirsiniz.</p>

        <!-- Sunucudan bir hata mesajı gelirse burada gösteriyoruz -->
        {% if error %}
            <div class="error-banner">
                <strong>Hata:</strong> {{ error }}
            </div>
        {% endif %}

        <!-- Excel dosyasını göndereceğimiz multipart formumuz -->
        <form action="/imports/preview" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="excel_file">Excel Dosyası Seçin</label>
                <!-- accept parametresi ile sadece xls ve xlsx uzantılı dosyaları seçtiriyoruz -->
                <input 
                    type="file" 
                    id="excel_file" 
                    name="file" 
                    accept=".xlsx, .xls"
                    required
                >
                <span class="format-info">Desteklenen formatlar: yalnızca .xlsx, .xls</span>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Ön İzle</button>
                <a href="/" class="btn-back">Ana Sayfaya Dön</a>
            </div>
        </form>
    </div>
</body>
</html>
