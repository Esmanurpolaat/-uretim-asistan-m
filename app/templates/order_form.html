<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Eğer 'order' varsa Düzenle, yoksa Yeni Oluştur başlığını gösteriyoruz -->
    <title>{% if order %}Sipariş Düzenle{% else %}Yeni Sipariş Ekle{% endif %} - Üretim Asistanım</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
        }

        /* Form Grid ve Grupları */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group-full {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #334155;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        /* Salt Okunur (Readonly) Alan Stili */
        input[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }

        /* Buton Grubu */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background-color: #3730a3;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group-full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Dinamik Başlık -->
            <h1>{% if order %}Sipariş Düzenle (No: {{ order.order_no }}){% else %}Yeni Sipariş Ekle{% endif %}</h1>
        </div>

        <!-- Eğer sunucudan bir hata mesajı gelirse kırmızı kutuda gösteriyoruz -->
        {% if error %}
            <div style="background-color: #fee2e2; color: #ef4444; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 20px; border: 1.5px solid #fca5a5;">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <!-- Formun gönderileceği rotayı dinamik seçiyoruz -->
        <form action="{% if order %}/orders/{{ order.id }}/edit{% else %}/orders/new{% endif %}" method="post">
            <div class="form-grid">
                
                <!-- Sipariş Numarası -->
                <div class="form-group">
                    <label for="order_no">Sipariş No</label>
                    <input type="text" id="order_no" name="order_no" required 
                           value="{{ order.order_no if order else '' }}"
                           {% if order %}readonly{% endif %}>
                </div>

                <!-- Kalem Numarası -->
                <div class="form-group">
                    <label for="item_no">Kalem No</label>
                    <input type="text" id="item_no" name="item_no" required 
                           value="{{ order.item_no if order else '' }}"
                           {% if order %}readonly{% endif %}>
                </div>

                <!-- Müşteri Adı -->
                <div class="form-group">
                    <label for="customer_name">Müşteri Adı</label>
                    <input type="text" id="customer_name" name="customer_name" required 
                           value="{{ order.customer_name if order else '' }}">
                </div>

                <!-- Satış Temsilcisi -->
                <div class="form-group">
                    <label for="sales_rep">Satış Temsilcisi</label>
                    <input type="text" id="sales_rep" name="sales_rep" 
                           value="{{ order.sales_rep if order and order.sales_rep else '' }}">
                </div>

                <!-- Ürün Seçimi (Dropdown) -->
                <div class="form-group">
                    <label for="product_id">Ürün</label>
                    <select id="product_id" name="product_id" required>
                        <option value="">-- Ürün Seçin --</option>
                        {% for product in products %}
                            <option value="{{ product.id }}" {% if order and order.product_id == product.id %}selected{% endif %}>
                                {{ product.product_code }} - {{ product.product_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Miktar -->
                <div class="form-group">
                    <label for="quantity">Miktar (Adet/Metre)</label>
                    <input type="number" step="any" id="quantity" name="quantity" required 
                           value="{{ order.quantity if order else '' }}">
                </div>

                <!-- En (cm) -->
                <div class="form-group">
                    <label for="width">En (cm)</label>
                    <input type="number" step="any" id="width" name="width" 
                           value="{{ order.width if order and order.width else '' }}">
                </div>

                <!-- Gramaj (g/m²) -->
                <div class="form-group">
                    <label for="grammage">Gramaj (g/m²)</label>
                    <input type="number" step="any" id="grammage" name="grammage" 
                           value="{{ order.grammage if order and order.grammage else '' }}">
                </div>

                <!-- Birim Fiyat -->
                <div class="form-group">
                    <label for="unit_price">Birim Fiyat</label>
                    <input type="number" step="any" id="unit_price" name="unit_price" required 
                           value="{{ order.unit_price if order else '0.0' }}">
                </div>

                <!-- Döviz -->
                <div class="form-group">
                    <label for="currency">Döviz</label>
                    <select id="currency" name="currency" required>
                        <option value="TRY" {% if order and order.currency == 'TRY' %}selected{% endif %}>TRY</option>
                        <option value="USD" {% if order and order.currency == 'USD' %}selected{% endif %}>USD</option>
                        <option value="EUR" {% if order and order.currency == 'EUR' %}selected{% endif %}>EUR</option>
                    </select>
                </div>

                <!-- Pazar Türü -->
                <div class="form-group">
                    <label for="market_type">Pazar Türü</label>
                    <select id="market_type" name="market_type" required>
                        <option value="Yurtiçi" {% if order and order.market_type == 'Yurtiçi' or not order %}selected{% endif %}>Yurtiçi</option>
                        <option value="Yurtdışı" {% if order and order.market_type == 'Yurtdışı' %}selected{% endif %}>Yurtdışı</option>
                    </select>
                </div>

                <!-- Öncelik -->
                <div class="form-group">
                    <label for="priority">Öncelik</label>
                    <select id="priority" name="priority" required>
                        <option value="Düşük" {% if order and order.priority == 'Düşük' %}selected{% endif %}>Düşük</option>
                        <option value="Orta" {% if order and order.priority == 'Orta' or not order %}selected{% endif %}>Orta</option>
                        <option value="Yüksek" {% if order and order.priority == 'Yüksek' %}selected{% endif %}>Yüksek</option>
                    </select>
                </div>

                <!-- Üretim Hattı Seçimi -->
                <div class="form-group">
                    <label for="production_line">Atanan Üretim Hattı</label>
                    <select id="production_line" name="production_line">
                        <option value="">-- Hat Seçin --</option>
                        {% for line in lines %}
                            <option value="{{ line.line_name }}" 
                                    {% if order and order.production_line == line.line_name %}selected{% endif %}>
                                {{ line.line_name }} (Operatör: {{ line.operator_name or 'Yok' }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Durum Seçimi -->
                <div class="form-group">
                    <label for="status">Sipariş Durumu</label>
                    <select id="status" name="status" required>
                        <option value="Yeni" {% if order and order.status == 'Yeni' %}selected{% endif %}>Yeni</option>
                        <option value="Planlandı" {% if order and order.status == 'Planlandı' %}selected{% endif %}>Planlandı</option>
                        <option value="Üretimde" {% if order and order.status == 'Üretimde' %}selected{% endif %}>Üretimde</option>
                        <option value="Tamamlandı" {% if order and order.status == 'Tamamlandı' %}selected{% endif %}>Tamamlandı</option>
                    </select>
                </div>

                <!-- Tahmini Teslim Tarihi -->
                <div class="form-group">
                    <label for="estimated_delivery_date">Tahmini Teslim Tarihi</label>
                    <input type="date" id="estimated_delivery_date" name="estimated_delivery_date" required
                           value="{{ order.estimated_delivery_date.strftime('%Y-%m-%d') if order and order.estimated_delivery_date else '' }}">
                </div>

                <!-- Gerçek Teslim Tarihi -->
                <div class="form-group">
                    <label for="actual_delivery_date">Gerçek Teslim Tarihi</label>
                    <input type="date" id="actual_delivery_date" name="actual_delivery_date"
                           value="{{ order.actual_delivery_date.strftime('%Y-%m-%d') if order and order.actual_delivery_date else '' }}">
                </div>

                <!-- Butonlar -->
                <div class="btn-group form-group-full">
                    <button type="submit" class="btn btn-primary">Kaydet</button>
                    <a href="/orders" class="btn btn-secondary">Vazgeç</a>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
